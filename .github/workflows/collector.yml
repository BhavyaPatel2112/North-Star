# Runs the North Star hourly collector on GitHub's servers.
# It updates CAMS and weather forecasts, re-checks the last 7 days of
# OpenAQ station readings, and logs the health of every station source.
#
# Secrets (database address and API keys) are stored in the repository's
# Settings > Secrets and variables > Actions, never in this file.

name: Hourly collector

on:
  schedule:
    - cron: "17 * * * *"   # every hour at minute 17 (UTC); avoids the busy top of the hour
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

# Never run two collectors at the same time.
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python -m scripts.run_collector

# Runs North Star's hourly jobs on GitHub's servers:
# 1. the collector: CAMS and weather forecasts, OpenAQ station readings,
#    fires, festival calendar, and health checks of every source
# 2. predictions for every map hexagon for the next 36 hours
#
# Secrets (database address and API keys) are stored in the repository's
# Settings > Secrets and variables > Actions, never in this file.

name: Hourly collector and predictions

# Started every hour at minute 17 by an external timer (cron-job.org), which
# calls GitHub's "run workflow" API with a token limited to this repository's
# Actions. GitHub's own schedule was unreliable for this repository (no runs
# for 5 hours after it was added), so it is not used. The same trigger also
# gives a "Run workflow" button for manual runs.
on:
  workflow_dispatch:

# Never run two collectors at the same time.
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python -m scripts.run_collector

      - name: Predict the map
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.predict_grid

# Render blueprint for the North Star route server.
# Render reads this file from the GitHub repository and sets the server up.
# Secrets marked "sync: false" are typed into Render's dashboard, never committed.
services:
  - type: web
    name: north-star-api
    runtime: python
    plan: free                      # sleeps after 15 minutes idle; wakes in about a minute
    region: singapore               # closest Render region to Mumbai
    rootDir: Backend
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn northstar.server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true                # redeploys on every push to main
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: DATABASE_URL           # Supabase session pooler connection string
        sync: false
      - key: GOOGLE_AIR_QUALITY_KEY # same Google key (Routes API enabled on it)
        sync: false
      - key: NORTHSTAR_APP_KEY      # shared key the app sends; Render makes one up
        generateValue: true
      - key: GOOGLE_ROUTES_DAILY_LIMIT
        value: "900"
      - key: GOOGLE_ROUTES_MONTHLY_LIMIT
        value: "60000"
